name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: budgetboard_test
          POSTGRES_USER: budgetboard
          POSTGRES_PASSWORD: budgetboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budgetboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DEBUG: "False"
      DATABASE_URL: postgres://budgetboard:budgetboard@localhost:5432/budgetboard_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: flake8 accounts budgets config

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests with coverage
        run: pytest --cov=accounts --cov=budgets --cov-report=term-missing