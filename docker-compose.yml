services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: budgetboard
      POSTGRES_USER: budgetboard
      POSTGRES_PASSWORD: budgetboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://budgetboard:budgetboard@db:5432/budgetboard
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: